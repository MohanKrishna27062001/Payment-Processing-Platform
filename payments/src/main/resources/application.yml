spring:
  application:
    name: payments

  # Database connection. Defaults target a local PostgreSQL; override with env vars in other environments.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USERNAME:payments}
    password: ${DB_PASSWORD:payments}

  jpa:
    open-in-view: false        # no lazy-loading from controllers; transactions end in the service layer
    hibernate:
      ddl-auto: validate       # Flyway owns the schema; Hibernate only checks entities match it

  flyway:
    # db/seed holds demo merchants for local runs. Drop it from this list in production.
    locations: classpath:db/migration,classpath:db/seed

  # Off by default so the app runs on machines without Docker (local PostgreSQL).
  # Set DOCKER_COMPOSE_ENABLED=true to have Spring start compose.yaml automatically.
  docker:
    compose:
      enabled: ${DOCKER_COMPOSE_ENABLED:false}
      lifecycle-management: start-only

server:
  port: ${PORT:8080}
  shutdown: graceful           # finish in-flight requests before stopping

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true          # /actuator/health/liveness and /actuator/health/readiness
      show-details: when-authorized

logging:
  structured:
    format:
      console: ecs             # JSON logs (Elastic Common Schema) to stdout
