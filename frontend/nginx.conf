server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # Everything the dashboard sends goes to /api on its own origin, so proxy it to the backend here.
    # The browser therefore sees a single origin and no CORS preflight -- the same arrangement the Vite
    # dev server provides, which is why the application code needs no base URL and no build-time switch.
    location /api/ {
        proxy_pass         http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # A capture waits on the processor, and a cold start waits on Flyway; the defaults would cut
        # those off at 60s with a 504 that looks like an application bug.
        proxy_connect_timeout 10s;
        proxy_read_timeout    120s;
    }

    # The OpenAPI schema and Swagger UI live on the backend too, so they are reachable from this origin.
    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass       http://backend:8080;
        proxy_set_header Host $host;
    }

    # React Router owns the paths below. Without this fallback, reloading /payments/{id} asks nginx for
    # a file that does not exist and returns 404 instead of the application.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames are immutable; index.html must never be cached or a deploy goes unnoticed.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;
}
